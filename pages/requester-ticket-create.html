<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo yêu cầu - FixFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" >
    <link href="../css/style.css" rel="stylesheet"> 
</head>
<body>
    <nav class="navbar navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-tools"></i> FixFlow</a>
            <span class="text-white small ms-auto me-3 d-none d-sm-inline">Nguyễn Minh Anh</span>
            <a class="btn btn-sm btn-outline-light" href="login.html">Đăng xuất</a>
        </div>
    </nav>

    <div class="container-fluid"><div class="row">
        <aside class="col-md-3 col-lg-2 sidebar p-3 border-end bg-white">
            <div class="small text-muted fw-bold mb-3 px-2">MENU</div>
            <nav class="nav flex-column gap-1">
                <a class="nav-link py-2" href="index.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                <a class="nav-link active py-2" href="requester-my-tickets.html"><i class="bi bi-ticket-perforated me-2"></i>Yêu cầu của tôi</a>
                <a class="nav-link py-2" href="notifications.html"><i class="bi bi-bell me-2"></i>Thông báo</a>
                <a class="nav-link py-2" href="profile.html"><i class="bi bi-person me-2"></i>Hồ sơ</a>
            </nav>
        </aside>

        <main class="col-md-9 col-lg-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h1 class="h4 fw-bold mb-0">Tạo yêu cầu bảo trì</h1>
                    <small class="text-muted">Điền thông tin để được hỗ trợ xử lý sự cố</small>
                </div>
                <a class="btn btn-outline-secondary btn-sm" href="requester-my-tickets.html"><i class="bi bi-arrow-left"></i> Quay lại</a>
            </div>

            <div class="card border-0 shadow-sm p-4">
                <form id="ticketForm" class="needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium required">Thiết bị</label>
                            <select class="form-select" required>
                                <option value="" selected disabled>-- Chọn thiết bị --</option>
                                <option>Máy chiếu P302 (Phòng P302)</option>
                                <option>Điều hòa A201 (Phòng A201)</option>
                                <option>PC Lab 1 (Phòng Máy 1)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium required">Vị trí chi tiết</label>
                            <input type="text" class="form-control" placeholder="Ví dụ: Phòng P302, Tòa A" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-medium required">Mô tả sự cố</label>
                            <textarea id="issueDesc" class="form-control" rows="4" placeholder="Mô tả dấu hiệu sự cố..." required></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium">Mức độ ưu tiên</label>
                            <select class="form-select mb-3">
                                <option>Thấp</option>
                                <option selected>Trung bình</option>
                                <option>Cao</option>
                            </select>
                            <label class="form-label fw-medium">Ảnh đính kèm</label>
                            <input type="file" class="form-control" accept="image/*">
                        </div>
                    </div>

                    <div id="aiBox" class="card ai-box p-3 mt-3 border-info d-none">
                        <div class="fw-bold text-primary mb-1"><i class="bi bi-magic me-1"></i>Gợi ý nhóm lỗi AI</div>
                        <p id="aiText" class="small mb-2"></p>
                        <button type="button" class="btn btn-sm btn-success w-auto" onclick="document.getElementById('aiBox').classList.add('d-none')">Áp dụng</button>
                    </div>

                    <div class="d-flex justify-content-between mt-4 pt-3 border-top">
                        <button type="button" id="aiBtn" class="btn btn-outline-primary"><i class="bi bi-stars"></i> AI gợi ý nhóm lỗi</button>
                        <div>
                            <a href="requester-my-tickets.html" class="btn btn-light me-1">Hủy</a>
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-send"></i> Gửi yêu cầu</button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

    <nav class="mobile-nav bg-white border-top justify-content-around py-2">
        <a href="index.html" class="text-center text-decoration-none text-muted small"><i class="bi bi-house d-block fs-5"></i>Trang chủ</a>
        <a href="requester-my-tickets.html" class="text-center text-decoration-none text-primary small"><i class="bi bi-ticket-perforated d-block fs-5"></i>Tickets</a>
        <a href="profile.html" class="text-center text-decoration-none text-muted small"><i class="bi bi-person d-block fs-5"></i>Tôi</a>
    </nav>

  <script src="../js/requester.js"></script>
</body>
</html>
